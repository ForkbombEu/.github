<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 828" role="img" aria-labelledby="t">
<title id="t">The Forkbomb stack: a Zencode cryptography core on the Zenroom VM, Interfacer Digital Product Passports, DIDroom digital identity, and Credimi EUDI Wallet conformance, each with its open-source repositories</title>
<style>
.layer{animation:rise .7s cubic-bezier(.16,1,.3,1) both}
.chip{animation:fade .5s ease-out both}
