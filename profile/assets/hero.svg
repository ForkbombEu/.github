<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="t d">
<title id="t">Forkbomb: EUDI Wallet identity and Digital Product Passports, built on open cryptography</title>
<desc id="d">The fork bomb :(){ :|:&amp; };: forks into the Forkbomb product family: Credimi, DIDroom, EUDI trust lists, Digital Product Passport, Zencode services, post-quantum and zero-knowledge cryptography.</desc>
<style>
.ch{opacity:1;animation:type .01s steps(1) both}
.cursor{animation:blink 1s steps(1) infinite}
.rise{animation:rise .7s cubic-bezier(.16,1,.3,1) both}
.edge{fill:none;stroke:#c7d2fe;stroke-opacity:.55;stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:0;animation:draw .6s ease-out both}
.node{animation:pop .4s cubic-bezier(.16,1,.3,1) both;transform-box:fill-box;transform-origin:center}
.leaf{animation:slide .6s cubic-bezier(.16,1,.3,1) both}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes type{from{opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.6)}}
@media (prefers-reduced-motion:reduce){.ch,.cursor,.rise,.edge,.node,.leaf,.pulse{animation:none}.packet{display:none}}
</style>
